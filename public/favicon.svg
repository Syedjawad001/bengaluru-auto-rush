<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Pixel-art auto-rickshaw (top-down), matching the in-game player auto -->
  <rect width="16" height="16" fill="#2a2238"/>
  <!-- mirrors -->
  <rect x="2" y="6" width="1" height="2" fill="#5d6478"/>
  <rect x="13" y="6" width="1" height="2" fill="#5d6478"/>
  <!-- outline -->
  <rect x="5" y="1" width="6" height="2" fill="#120c1e"/>
  <rect x="4" y="2" width="8" height="13" fill="#120c1e"/>
  <rect x="3" y="4" width="10" height="10" fill="#120c1e"/>
  <!-- green front with headlights -->
  <rect x="5" y="2" width="6" height="2" fill="#1fa84a"/>
  <rect x="5" y="3" width="1" height="1" fill="#ff7a1a"/>
  <rect x="10" y="3" width="1" height="1" fill="#ff7a1a"/>
  <!-- windshield -->
  <rect x="4" y="4" width="8" height="1" fill="#2f8fe0"/>
  <rect x="6" y="4" width="1" height="1" fill="#9be0ff"/>
  <!-- yellow canopy -->
  <rect x="4" y="5" width="8" height="7" fill="#f6c624"/>
  <rect x="4" y="5" width="1" height="7" fill="#ffe27a"/>
  <rect x="5" y="7" width="6" height="1" fill="#b07d10"/>
  <rect x="5" y="9" width="6" height="1" fill="#b07d10"/>
  <!-- green rear with tail lights -->
  <rect x="5" y="12" width="6" height="2" fill="#1fa84a"/>
  <rect x="5" y="13" width="1" height="1" fill="#e23b3b"/>
  <rect x="10" y="13" width="1" height="1" fill="#e23b3b"/>
  <rect x="7" y="13" width="2" height="1" fill="#fff6dc"/>
</svg>
